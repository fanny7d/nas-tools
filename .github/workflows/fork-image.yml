name: Build and publish fork image
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test naming and download retries
        run: |
          python3 -m unittest discover -s tests -p test_extended_edition.py -v
          python3 -m unittest discover -s tests -p test_downloader_retry.py -v
      - name: Prepare build context
        run: python3 scripts/prepare_fork_image.py --output "$RUNNER_TEMP/nastools-context" --revision "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/nastools-context
          file: ${{ runner.temp }}/nastools-context/source/docker/fork.Dockerfile
          platforms: linux/amd64
          build-args: SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: ghcr.io/fanny7d/nas-tools:sha-${{ github.sha }}
      - name: Smoke test image
        run: |
          docker run --rm --network none --entrypoint python3 ghcr.io/fanny7d/nas-tools:sha-${GITHUB_SHA} -c 'import qbittorrentapi, flask_cors, bencode; from pathlib import Path; assert not any(Path("/nas-tools").rglob("._*"))'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          image=ghcr.io/fanny7d/nas-tools
          docker push "$image:sha-$GITHUB_SHA"
          if [ "$REF_TYPE" = tag ]; then
            docker tag "$image:sha-$GITHUB_SHA" "$image:$REF_NAME"
            docker push "$image:$REF_NAME"
          fi
